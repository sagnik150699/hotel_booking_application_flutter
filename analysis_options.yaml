# Strict analysis for the whole project.
#
# `flutter_lints` gives the recommended Flutter rule set; the additions below
# tighten it so that unsafe casts, implicit dynamics, debugging leftovers and
# unawaited futures are caught by `flutter analyze` (which runs in CI).
include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    # Promote a few lints to errors so CI fails loudly.
    avoid_print: error
    unawaited_futures: error
    missing_required_param: error
    missing_return: error
    dead_code: warning
  exclude:
    - build/**
    - '**/*.g.dart'
    - android/**
    - ios/**
    - web/**
    - windows/**

linter:
  rules:
    # Correctness
    - always_declare_return_types
    - avoid_dynamic_calls
    - avoid_slow_async_io
    - avoid_type_to_string
    - cancel_subscriptions
    - close_sinks
    - discarded_futures
    - literal_only_boolean_expressions
    - no_adjacent_strings_in_list
    - test_types_in_equals
    - throw_in_finally
    - unawaited_futures
    - unnecessary_await_in_return
    - unnecessary_statements
    - use_build_context_synchronously

    # Security & hygiene
    - avoid_print
    - avoid_catches_without_on_clauses
    - only_throw_errors
    - prefer_final_locals
    - prefer_final_in_for_each
    - unnecessary_lambdas
    - use_string_buffers

    # Style consistency for course material
    - directives_ordering
    - prefer_single_quotes
    - require_trailing_commas
    - sort_pub_dependencies
    - unnecessary_parenthesis
    - use_super_parameters
    - prefer_const_constructors
    - prefer_const_constructors_in_immutables
    - prefer_const_declarations
    - prefer_const_literals_to_create_immutables
    - sized_box_shrink_expand
    - use_colored_box
    - use_decorated_box
    - use_named_constants
